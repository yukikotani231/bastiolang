name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Z3
        run: sudo apt-get update && sudo apt-get install -y z3
      - name: Build stage0
        run: cd stage0 && RUSTFLAGS="-D warnings" cargo build --release
      - name: Tests
        run: tests/run.sh
      - name: Self-hosted compiler, differential tests
        run: stage1/difftest.sh
