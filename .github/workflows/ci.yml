name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Install Z3 and cvc5
        run: sudo grep -rlE 'packages\.microsoft\.com' /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null | xargs -r sudo rm -f; sudo apt-get update && sudo apt-get install -y z3 cvc5
      # rust-toolchain.toml pins the Rust release; rustup installs it here.
      - name: Tool versions
        run: |
          rustc --version
          cargo --version
          z3 --version
          cvc5 --version | head -1
          cc --version | head -1
          python3 --version
      - name: Build stage0
        run: cd stage0 && RUSTFLAGS="-D warnings" cargo build --release --locked
      - name: Build bastioc1 with stage0 (the compiler the tests use)
        run: tests/bastioc1.sh
      - name: Tests
        run: tests/run.sh
      - name: The IR (golden outputs of irdump)
        run: tests/ir.sh
      - name: Register allocation over the IR (golden outputs of irradump, validity over the corpus)
        run: tests/ra.sh
      - name: Native backend, differential test against the C backend
        run: tests/native.sh
      - name: Native backend with the IR emitter, differential test against the C backend
        run: BACKEND=native-ir tests/native.sh
      - name: Native backend (IR emitter), GNU as and cc instead of bastioc1's own
        run: GNU_LINK=1 BACKEND=native-ir tests/native.sh
      - name: Native backend (IR emitter), linked for musl's dynamic loader
        run: sudo apt-get install -y musl && MUSL_LINK=1 BACKEND=native-ir tests/native.sh
      - name: In-house assembler, byte-for-byte against GNU as
        run: tests/as86.sh
      - name: Relocatable objects of our own (libraries), against GNU as
        run: tests/elfobj.sh
      - name: WebAssembly backend, run by Node.js against the C backend
        run: tests/wasm.sh && tests/wasm_lib.sh
      - name: In-house AArch64 assembler, word for word against GNU as
        run: sudo apt-get install -y binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu && tests/as64.sh
      - name: Mach-O executables of our own (headers, segments, the arm64 code signature)
        run: tests/macho.sh
      - name: Proof cache
        run: tests/proof_cache.sh
      - name: Packages (the bastio tool, bastio.lock, git dependencies)
        run: tests/package.sh
      - name: Developer tools (bastiofmt, bastio-lsp, Neovim)
        run: sudo apt-get install -y neovim && tests/tools.sh
      - name: A second solver confirms the proofs (cvc5, docs/trusted-base-reduction.md)
        run: tests/crosscheck.py --selftest && tests/crosscheck.py --min-agree 90 && CROSSCHECK_BASTIOC=$PWD/stage0/target/release/bastioc1 tests/crosscheck.py --min-agree 90 stage1/bastioc1.bastio
      - name: Fuzzing, a short deterministic run (tests/fuzz.py)
        run: tests/fuzz.py --seed 1 --count 1000 --keep fuzz-findings
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: fuzz-findings-${{ github.sha }}
          path: fuzz-findings
          if-no-files-found: ignore
  macos:
    # The hosted toolchain on macOS: Apple Silicon and Intel.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Install Z3 and GNU coreutils
        run: brew install z3 coreutils
      - name: Tool versions
        run: |
          rustc --version
          z3 --version
          cc --version | head -1
          uname -m
      - name: Build stage0
        run: cd stage0 && RUSTFLAGS="-D warnings" cargo build --release --locked
      - name: Build bastioc1 with stage0
        run: tests/bastioc1.sh
      - name: Tests
        run: |
          rc=0
          tests/run.sh > run.log 2>&1 || rc=$?
          grep -A12 '^FAIL' run.log || true
          tail -1 run.log
          exit $rc
      - name: Native AArch64 backend (Mach-O), assembled, linked and signed by bastioc1 itself
        if: matrix.os == 'macos-14'
        run: NATIVE_OS=macos tests/aarch64_native.sh
      - name: Native AArch64 backend (Mach-O), Apple's as and cc instead of bastioc1's own
        if: matrix.os == 'macos-14'
        run: NATIVE_OS=macos GNU_LINK=1 tests/aarch64_native.sh
      - name: Native x86-64 backend (Mach-O), assembled and linked by bastioc1 itself
        if: matrix.os == 'macos-15-intel'
        run: NATIVE_OS=macos BACKEND=native-ir tests/native.sh
      - name: Native x86-64 backend (Mach-O), Apple's as and cc instead of bastioc1's own
        if: matrix.os == 'macos-15-intel'
        run: NATIVE_OS=macos BACKEND=native-ir GNU_LINK=1 tests/native.sh
      - name: Tests with the compiler built by the native backend (AArch64)
        if: matrix.os == 'macos-14'
        run: |
          # bastioc1 compiled to a Mach-O executable by the native backend, then used
          # as the compiler of the whole suite (it starts z3 and cc itself).
          stage0/target/release/bastioc1 --arch aarch64 --backend native --os macos -o "$RUNNER_TEMP/bastioc1-native" stage1/bastioc1.bastio
          rc=0
          BASTIOC="$RUNNER_TEMP/bastioc1-native" tests/run.sh > run-native.log 2>&1 || rc=$?
          grep -A12 '^FAIL' run-native.log | head -150 || true
          tail -3 run-native.log
          exit $rc
      - name: Front end and verifier against stage0 (difftest, dumps)
        if: matrix.os == 'macos-14'
        run: DIFFTEST_PARTS=dumps stage1/difftest.sh
      - name: Tests with the compiler built by the native backend (x86-64)
        if: matrix.os == 'macos-15-intel'
        run: |
          stage0/target/release/bastioc1 --backend native-ir --os macos -o "$RUNNER_TEMP/bastioc1-native" stage1/bastioc1.bastio
          rc=0
          BASTIOC="$RUNNER_TEMP/bastioc1-native" tests/run.sh > run-native.log 2>&1 || rc=$?
          grep -A12 '^FAIL' run-native.log | head -150 || true
          tail -3 run-native.log
          exit $rc
  windows:
    # The hosted toolchain under MSYS2 / MinGW-w64 (ROADMAP, other host
    # platforms): the C backend, with the sanitizer cross-check skipped, and
    # the native-IR backend's PE/COFF assembly.
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc mingw-w64-x86_64-z3 mingw-w64-x86_64-rust mingw-w64-x86_64-python
            make diffutils
      - name: Tool versions
        run: |
          rustc --version
          z3 --version
          cc --version | head -1
      - name: Build stage0
        run: cd stage0 && cargo build --release --locked
      - name: Build bastioc1 with stage0
        run: tests/bastioc1.sh
      - name: Tests
        run: |
          # Native programs (bastioc1, the solver) must be given paths they
          # open too: C:/-style, not MSYS2's /tmp.
          export TMPDIR=$(cygpath -m /tmp)
          rc=0
          tests/run.sh > run.log 2>&1 || rc=$?
          grep -A8 '^FAIL' run.log | head -150 || true
          tail -1 run.log
          exit $rc
      - name: Native backend, MinGW-w64 as and cc
        run: |
          export TMPDIR=$(cygpath -m /tmp)
          MINGW_LINK=1 NATIVE_OS=windows BACKEND=native-ir tests/native.sh > native-mingw.log 2>&1 || rc=$?
          grep -A12 '^FAIL' native-mingw.log | head -200 || true
          tail -2 native-mingw.log
          exit ${rc:-0}
      - name: Native backend (PE/COFF, linked by bastioc1's own PE linker)
        run: |
          export TMPDIR=$(cygpath -m /tmp)
          NATIVE_OS=windows BACKEND=native-ir tests/native.sh > native.log 2>&1 || rc=$?
          grep -A12 '^FAIL' native.log | head -200 || true
          tail -2 native.log
          exit ${rc:-0}
      - name: Tests with the compiler built by the native backend
        run: |
          # bastioc1 compiled to a Windows executable by the native backend, then used
          # as the compiler of the whole suite (it starts z3 and cc itself).
          export TMPDIR=$(cygpath -m /tmp)
          stage0/target/release/bastioc1 --backend native-ir --os windows -o "$TMPDIR/bastioc1-native.exe" stage1/bastioc1.bastio
          rc=0
          BASTIOC=$(cygpath -u "$TMPDIR/bastioc1-native.exe") tests/run.sh > run-native.log 2>&1 || rc=$?
          grep -A8 '^FAIL' run-native.log | head -150 || true
          echo "tests/run.sh exit code $rc, $(wc -l < run-native.log) lines of output"
          tail -20 run-native.log
          exit $rc
  difftest:
    # stage1/difftest.sh compares every phase of the self-hosted compiler with
    # stage0's. Its parts (DIFFTEST_PARTS) are independent, so each runs on a
    # machine of its own: once with the tools built by stage0 and once with
    # the tools built by the native backend (tests/native.sh --stage1).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: [dumps, backends mutants-front, driver, mutants-back]
        tools: [stage0, native]
    name: difftest (${{ matrix.part }}, tools built by ${{ matrix.tools }})
    steps:
      - uses: actions/checkout@v5
      - name: Install Z3
        run: sudo grep -rlE 'packages\.microsoft\.com' /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null | xargs -r sudo rm -f; sudo apt-get update && sudo apt-get install -y z3
      - name: Build stage0
        run: cd stage0 && RUSTFLAGS="-D warnings" cargo build --release --locked
      - name: Differential tests
        env:
          DIFFTEST_PARTS: ${{ matrix.part }}
        run: |
          if [ "${{ matrix.tools }}" = native ]; then
            tests/native.sh --stage1
          else
            stage1/difftest.sh
          fi
  aarch64:
    # AArch64 through the C backend: every test program built for AArch64
    # runs under qemu-aarch64 as on x86-64, the compiler built for AArch64
    # writes the same C for itself, the user programs build for AArch64,
    # and a small kernel boots on QEMU's virt machine.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install Z3, an AArch64 cross compiler and QEMU
        run: sudo grep -rlE 'packages\.microsoft\.com' /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null | xargs -r sudo rm -f; sudo apt-get update && sudo apt-get install -y z3 gcc-aarch64-linux-gnu qemu-user qemu-system-arm
      - name: Build stage0
        run: cd stage0 && RUSTFLAGS="-D warnings" cargo build --release --locked
      - name: AArch64 tests
        run: tests/aarch64.sh
  stage0-mirror:
    # The stage0 freeze (docs/bootstrap.md): a change to stage0/ needs a
    # `Stage0-only: <why>` or `Stage0-shared: <why>` line in a commit
    # message, and a shared change needs its stage1 mirror.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: stage0 is frozen (changes say why)
        run: tests/stage0_mirror.sh ${{ github.event.pull_request.base.sha }}
      - name: every builtin has native code (or is listed as missing)
        run: tests/native_builtins.sh
      - name: the prelude refuses hostile boot information
        run: tests/prelude_boot.sh
  editors:
    # The tree-sitter grammar must parse, and the TextMate grammar tokenize,
    # every .bastio file in the repository.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: tree-sitter grammar
        run: |
          npm install -g tree-sitter-cli@0.25.10
          editors/tree-sitter-bastio/test/parse_all.sh
      - name: VS Code grammar
        run: cd editors/vscode && npm ci && npm test
  site:
    # The documentation website builds, and every link between its pages
    # resolves. pages.yml publishes it.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Install mdBook
        run: curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.52/mdbook-v0.4.52-x86_64-unknown-linux-gnu.tar.gz | tar xz -C /usr/local/bin
      - name: Build the site
        run: site/build.sh
      - uses: actions/upload-artifact@v5
        with:
          name: site-${{ github.sha }}
          path: site/build/html
  bench:
    # Timings are kept, not judged: a regression shows up in the artifact of
    # the change that caused it. The job fails only if a benchmark breaks
    # (rejected, crashes, or disagrees with its C twin).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Z3
        run: sudo grep -rlE 'packages\.microsoft\.com' /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null | xargs -r sudo rm -f; sudo apt-get update && sudo apt-get install -y z3
      - name: Build stage0
        run: cd stage0 && cargo build --release
      - name: Build bastioc1 with stage0
        run: tests/bastioc1.sh
      - name: Benchmarks
        run: |
          set -o pipefail
          bench/run.sh | tee bench.txt
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: bench-${{ github.sha }}
          path: bench.txt
