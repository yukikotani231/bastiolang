name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Z3
        run: sudo apt-get update && sudo apt-get install -y z3
      - name: Build stage0
        run: cd stage0 && RUSTFLAGS="-D warnings" cargo build --release
      - name: Tests
        run: tests/run.sh
      - name: Self-hosted compiler, differential tests
        run: stage1/difftest.sh
  bench:
    # Timings are kept, not judged: a regression shows up in the artifact of
    # the change that caused it. The job fails only if a benchmark breaks
    # (rejected, crashes, or disagrees with its C twin).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Z3
        run: sudo apt-get update && sudo apt-get install -y z3
      - name: Build stage0
        run: cd stage0 && cargo build --release
      - name: Benchmarks
        run: |
          set -o pipefail
          bench/run.sh | tee bench.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-${{ github.sha }}
          path: bench.txt
