# The labels of this repository. .github/workflows/labels.yml creates or
# updates them when this file changes on main; labels not listed here are left
# alone. See CONTRIBUTING.md ("Finding something to work on").
- name: good first issue
  color: 7057ff
  description: Small, well-scoped, and the issue says where to start
- name: help wanted
  color: 008672
  description: Open for anyone; larger than a first issue
- name: bug
  color: d73a4a
  description: Something does not work as documented
- name: enhancement
  color: a2eeef
  description: A new feature or an improvement
- name: documentation
  color: 0075ca
  description: Docs, tutorials, examples and comments
- name: question
  color: d876e3
  description: A question about using or changing the project
- name: area/language
  color: c5def5
  description: The language and its rules
- name: area/compiler
  color: c5def5
  description: Parser, checker, verifier and the backends
- name: area/library
  color: c5def5
  description: core/ and std/
- name: area/tests
  color: c5def5
  description: Test programs and the test scripts
- name: area/ci
  color: c5def5
  description: Workflows and build scripts
- name: area/docs-site
  color: c5def5
  description: The documentation website
- name: performance
  color: fbca04
  description: Speed of generated code or of the compiler
- name: proofs
  color: fbca04
  description: What can be proved, and how fast
